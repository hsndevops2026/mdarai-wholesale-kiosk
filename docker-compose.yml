# Local full stack with FICTIONAL demo data: docker compose up --build
# Web: http://localhost:3000  API: http://localhost:4000  (secrets below are dev-only placeholders)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kiosk
      POSTGRES_PASSWORD: kiosk
      POSTGRES_DB: kiosk
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiosk"]
      interval: 3s
      retries: 20

  migrate:
    build: { context: ., dockerfile: infrastructure/docker/migrate.Dockerfile }
    environment:
      DATABASE_URL: postgresql://kiosk:kiosk@db:5432/kiosk
      ID_HASH_PEPPER: dev-only-pepper-change-me-0000
      RUN_DEMO_SEED: "true"
    depends_on: { db: { condition: service_healthy } }

  api:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    env_file: [.env.example]
    environment:
      DATABASE_URL: postgresql://kiosk:kiosk@db:5432/kiosk
      CORS_ORIGINS: http://localhost:3000
    ports: ["4000:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args: { NEXT_PUBLIC_API_URL: http://localhost:4000 }
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
